name: Release

# Auto-release.
#
# PRIMARY trigger: `workflow_run` — as soon as the `CI` workflow finishes
# successfully on `dev`, this builds and publishes a release. That is the
# "CI built successfully -> release is updated" path.
#
# Why not rely on the cron: GitHub's `schedule` trigger is unreliable — runs
# are routinely delayed by hours and are known to be skipped on forked repos.
# This repo is a fork, and in practice every release since v0.0.1 was produced
# by a manual workflow_dispatch click, never by the cron. So the cron is kept
# only as a fallback (03:17 UTC nightly), and `workflow_dispatch` remains for
# forcing a specific tag (e.g. v0.0.2 to ship a stable, non-prerelease build).
#
# Behaviour: checks whether the commit being released has new commits since the
# last v0.0.* release tag. If it does, it bumps the patch (0.0.N ->
# 0.0.N+1-alpha), builds a SIGNED release APK, and publishes it as a GitHub
# Release. If nothing changed (or CI is not green), it publishes nothing.
#
# Requires these GitHub Secrets (repo -> Settings -> Secrets and variables ->
# Actions):
#   KEYSTORE_FILE      base64 of the release keystore
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias (e.g. materialreader)
#   KEY_PASSWORD       key password
#
# NOTE: scheduled workflows run from the REPOSITORY DEFAULT branch. `dev` is
# this repo's default branch.

on:
    schedule:
        -   cron: '17 3 * * *'      # 03:17 UTC nightly (fallback only)
    workflow_run:
        workflows: ['build.yml']
        types: ['completed']
    workflow_dispatch:
        inputs:
            version:
                description: 'Force a version tag, e.g. v0.0.2 (skips the change check). Leave blank for auto.'
                required: false

permissions:
    contents: write
    checks: read

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    # workflow_run: the exact SHA the CI run just validated;
                    # schedule/dispatch: current dev HEAD.
                    ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'dev' }}

            -   name: Install GitHub CLI
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    type -p gh >/dev/null 2>&1 || {
                        sudo apt-get update && sudo apt-get install -y gh
                    }
                    gh --version

            -   name: Determine version / whether to release
                id: ver
                run: |
                    git fetch --tags --force
                    LATEST="$(git tag --list 'v0.0.*' | sort -V | tail -n1)"
                    echo "latest release tag: ${LATEST:-none}"
                    echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

                    # Which commit to release.
                    if [ "${{ github.event_name }}" = "workflow_run" ]; then
                        if [ "${{ github.event.workflow_run.head_branch }}" != "dev" ]; then
                            echo "CI completed on '${{ github.event.workflow_run.head_branch }}' (not dev) — no release."
                            echo "changed=false" >> "$GITHUB_OUTPUT"
                            exit 0
                        fi
                        if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
                            echo "CI run ended '${{ github.event.workflow_run.conclusion }}' — no release."
                            echo "changed=false" >> "$GITHUB_OUTPUT"
                            exit 0
                        fi
                        TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
                    else
                        TARGET_SHA="$(git rev-parse dev)"
                    fi
                    echo "releasing commit: ${TARGET_SHA}"

                    # Guard: only release a commit that CI has verified green.
                    # The CI job reports through the modern check-runs API (a
                    # check-run named "ci"); the legacy combined-status endpoint
                    # (/commits/<sha>/status) reports "pending" with zero
                    # statuses for these SHAs, so it is NOT used.
                    # If the API call itself fails, fall back to releasing
                    # (same as before) rather than crashing the step.
                    set +e
                    CI_CONCL="$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/check-runs" --jq '.check_runs[] | select(.name == "ci") | .conclusion' 2>/dev/null | head -n1)"
                    API_OK=$?
                    set -e
                    if [ ${API_OK} -ne 0 ] || [ -z "${CI_CONCL}" ]; then
                        if [ "${{ github.event_name }}" = "workflow_run" ]; then
                            echo "Could not re-read the CI check-run, but this run was triggered by a successful CI — proceeding."
                        else
                            echo "::warning::No CI check-run found for ${TARGET_SHA} — cannot verify green, skipping (the next green CI run will retry)."
                            echo "changed=false" >> "$GITHUB_OUTPUT"
                            exit 0
                        fi
                        CI_CONCL="success"
                    fi
                    echo "CI conclusion for ${TARGET_SHA}: ${CI_CONCL}"
                    if [ "${CI_CONCL}" != "success" ]; then
                        echo "::warning::Target commit is not green (conclusion=${CI_CONCL}). Skipping release."
                        echo "changed=false" >> "$GITHUB_OUTPUT"
                        exit 0
                    fi

                    if [ -n "${{ github.event.inputs.version }}" ]; then
                        TAG="${{ github.event.inputs.version }}"
                        CHANGED=true
                    elif [ -z "${LATEST}" ]; then
                        TAG="v0.0.1-alpha"
                        CHANGED=true
                    else
                        AHEAD="$(git rev-list --count "${LATEST}..${TARGET_SHA}")"
                        echo "commits on dev since ${LATEST}: ${AHEAD}"
                        if [ "${AHEAD}" -gt 0 ]; then
                            base="${LATEST#v}"; num="${base%%-*}"; patch="${num##*.}"; next=$((patch + 1)); prefix="${num%.*}"
                            TAG="v${prefix}.${next}-alpha"
                            CHANGED=true
                        else
                            CHANGED=false
                        fi
                    fi
                    echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                    echo "versionName=${TAG#v}" >> "$GITHUB_OUTPUT"
                    echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

            -   name: No changes — skip release
                if: steps.ver.outputs.changed != 'true'
                run: echo "No new commits on dev since the last release (${{ steps.ver.outputs.latest }}). Nothing to build."

            -   name: Set up Java 21
                if: steps.ver.outputs.changed == 'true'
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 21

            -   name: Validate Gradle wrapper
                if: steps.ver.outputs.changed == 'true'
                uses: gradle/actions/wrapper-validation@v6

            -   name: Set up Gradle
                if: steps.ver.outputs.changed == 'true'
                uses: gradle/actions/setup-gradle@v6

            -   name: Install NDK
                if: steps.ver.outputs.changed == 'true'
                run: |
                    SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                    NDK_VERSION="$(grep -m1 '^ndk' gradle/libs.versions.toml | sed -E 's/ndk[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
                    echo "Installing NDK ${NDK_VERSION}"
                    echo "y" | "$SDKMANAGER" "ndk;${NDK_VERSION}" --sdk_root="${ANDROID_SDK_ROOT}"

            -   name: Decode keystore
                if: steps.ver.outputs.changed == 'true'
                run: |
                    echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > "${{ github.workspace }}/release.keystore"

            -   name: Build signed release APK
                if: steps.ver.outputs.changed == 'true'
                env:
                    KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    ./gradlew assembleRelease -PVERSION_NAME="${{ steps.ver.outputs.versionName }}"

            -   name: Rename APK for release
                if: steps.ver.outputs.changed == 'true'
                run: |
                    mv build/outputs/apk/release/MaterialReader-release.apk \
                       "MaterialReader-${{ steps.ver.outputs.versionName }}.apk"

            -   name: Publish GitHub Release
                if: steps.ver.outputs.changed == 'true'
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ steps.ver.outputs.tag }}
                    name: Release ${{ steps.ver.outputs.versionName }}
                    prerelease: ${{ contains(steps.ver.outputs.versionName, '-alpha') }}
                    files: MaterialReader-${{ steps.ver.outputs.versionName }}.apk
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
