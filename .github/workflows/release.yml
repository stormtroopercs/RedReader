name: Release

# Builds a SIGNED release APK whenever a Git tag matching v0.0.x(-alpha)
# is pushed, and publishes it as a GitHub Release.
#
# Requires these GitHub Secrets (repo → Settings → Secrets and variables → Actions):
#   KEYSTORE_FILE      base64 of the release keystore (output of scripts/generate_keystore.sh)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias (e.g. materialreader)
#   KEY_PASSWORD       key password
#
# Trigger a release with:  ./scripts/bump-release.sh  (bumps, commits, tags, pushes)

on:
    push:
        tags:
            - 'v0.0.*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version tag to build, e.g. v0.0.2-alpha'
                required: true
                default: 'v0.0.1-alpha'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Java 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 21

            -   name: Validate Gradle wrapper
                uses: gradle/actions/wrapper-validation@v3

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v3

            -   name: Install NDK
                run: |
                    SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                    NDK_VERSION="$(yq .versions.ndk gradle/libs.versions.toml)"
                    echo "Installing NDK ${NDK_VERSION}"
                    echo "y" | "$SDKMANAGER" "ndk;${NDK_VERSION}" --sdk_root="${ANDROID_SDK_ROOT}"

            -   name: Decode keystore
                run: |
                    echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > "${{ github.workspace }}/release.keystore"

            -   name: Set version name from tag
                id: ver
                run: |
                    if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                        TAG="${{ github.event.inputs.version }}"
                    else
                        TAG="${GITHUB_REF_NAME}"
                    fi
                    echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                    # strip leading 'v'
                    echo "versionName=${TAG#v}" >> "$GITHUB_OUTPUT"

            -   name: Build signed release APK
                env:
                    KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    ./gradlew assembleRelease \
                        -PVERSION_NAME="${{ steps.ver.outputs.versionName }}"

            -   name: Rename APK for release
                run: |
                    mv build/outputs/apk/release/RedReader-release.apk \
                       "MaterialReader-${{ steps.ver.outputs.versionName }}.apk"

            -   name: Publish GitHub Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ steps.ver.outputs.tag }}
                    name: MaterialReader ${{ steps.ver.outputs.versionName }}
                    prerelease: ${{ contains(steps.ver.outputs.versionName, '-alpha') }}
                    files: MaterialReader-${{ steps.ver.outputs.versionName }}.apk
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
